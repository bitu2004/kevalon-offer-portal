<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kevalon Technology — Internship Offer Portal</title>
    <link rel="icon" type="image/png" href="https://kevalontechnology.in/assets/logo/Kevalon2.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Inter', sans-serif; background: #f8fafc; }

      :root {
        --kt-blue:       #1a56db;
        --kt-blue-dark:  #1040a8;
        --kt-teal:       #0ea5e9;
        --kt-teal-light: #38bdf8;
        --kt-grad:       linear-gradient(135deg, #1a56db 0%, #0ea5e9 100%);
        --kt-grad-dark:  linear-gradient(135deg, #0f3a8a 0%, #0d6e8e 100%);

        --color-background-primary:   #ffffff;
        --color-background-secondary: #f1f5f9;
        --color-background-tertiary:  #f8fafc;
        --color-text-primary:   #0f172a;
        --color-text-secondary: #64748b;
        --color-text-tertiary:  #94a3b8;
        --color-text-danger:    #dc2626;
        --color-border-primary:   #e2e8f0;
        --color-border-secondary: #cbd5e1;
        --color-border-tertiary:  #e2e8f0;
        --color-border-danger:    #fca5a5;
      }

      input, select, button { font-family: 'Inter', sans-serif; }

      /* ── Responsive grid helpers ── */
      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .grid-2 .col-full { grid-column: 1 / -1; }
      @media (max-width: 480px) {
        .grid-2 { grid-template-columns: 1fr !important; }
        .grid-2 .col-full { grid-column: 1 !important; }
      }

      /* ── Card padding responsive ── */
      .form-card { padding: 32px 28px; }
      @media (max-width: 480px) {
        .form-card { padding: 20px 16px !important; border-radius: 14px !important; }
      }

      /* ── Token input row ── */
      .token-row { display: flex; gap: 10px; }
      @media (max-width: 400px) {
        .token-row { flex-direction: column; }
        .token-row input { font-size: 13px !important; letter-spacing: 1px !important; }
        .token-row button { width: 100%; }
      }

      /* ── Details grid ── */
      .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; }
      @media (max-width: 480px) {
        .details-grid { grid-template-columns: 1fr !important; gap: 12px !important; }
      }

      /* ── Verify banner ── */
      .verify-banner { display: flex; align-items: center; gap: 16px; }
      @media (max-width: 480px) {
        .verify-banner { flex-direction: column; text-align: center; }
        .verify-banner > div:first-child { margin: 0 auto; }
      }

      /* ── Page header padding ── */
      @media (max-width: 480px) {
        .page-header { padding: 32px 16px 52px !important; }
        .page-header h1 { font-size: 26px !important; }
        .page-header p { font-size: 14px !important; }
      }

      /* ── Popup ── */
      @media (max-width: 480px) {
        .popup-inner { padding: 24px 16px !important; }
        .popup-token { font-size: 20px !important; letter-spacing: 2px !important; }
      }

      /* ── Welcome Page Hero Stats responsive ── */
      .hero-stats-row {
        display: flex !important;
        gap: 40px !important;
        justify-content: center !important;
        flex-wrap: nowrap !important;
      }
      .hero-stat-item {
        text-align: center;
      }
      .hero-stat-val {
        color: #38bdf8;
        font-size: 28px;
        font-weight: 800;
        transition: font-size 0.2s;
      }
      .hero-stat-label {
        color: rgba(255, 255, 255, 0.5);
        font-size: 13px;
        margin-top: 4px;
        transition: font-size 0.2s;
      }
      @media (max-width: 600px) {
        .hero-stats-row {
          gap: 16px !important;
          margin-top: 40px !important;
        }
        .hero-stat-val {
          font-size: 20px !important;
        }
        .hero-stat-label {
          font-size: 10px !important;
          margin-top: 2px !important;
        }
      }
      @media (max-width: 360px) {
        .hero-stats-row {
          gap: 10px !important;
        }
        .hero-stat-val {
          font-size: 17px !important;
        }
        .hero-stat-label {
          font-size: 9px !important;
        }
      }

      /* ── Admin Panel responsive ── */
      @media (max-width: 600px) {
        .admin-header { padding: 16px 16px !important; }
        .admin-content { padding: 16px 12px !important; }
        .admin-login-card { padding: 32px 20px !important; border-radius: 18px !important; }
        .admin-stats-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 10px !important; }
        .admin-analytics-grid { grid-template-columns: 1fr !important; }
        .admin-filter-row { flex-wrap: wrap !important; gap: 6px !important; }
        .admin-filter-row button { font-size: 11px !important; padding: 6px 10px !important; }
        .admin-header-btns { flex-wrap: wrap !important; gap: 6px !important; }
        .admin-header-btns button { font-size: 11px !important; padding: 6px 10px !important; }
        .admin-tabs button { font-size: 12px !important; padding: 7px 12px !important; }
        .admin-bulk-row {
          flex-direction: column !important;
          align-items: flex-start !important;
          margin-left: 0 !important;
          width: 100% !important;
          margin-top: 10px !important;
          gap: 6px !important;
        }
        .admin-modal { padding: 20px 16px !important; }
        .admin-modal-grid { grid-template-columns: 1fr !important; }
        .admin-modal-actions { flex-wrap: wrap !important; }
        .admin-modal-actions button { flex: unset !important; width: 100% !important; }
        .admin-req-row { flex-direction: column !important; align-items: flex-start !important; gap: 10px !important; }
        .admin-req-actions { flex-wrap: wrap !important; width: 100% !important; }
      }
      @media (max-width: 400px) {
        .admin-stats-grid { grid-template-columns: repeat(2, 1fr) !important; }
      }

      /* ── Prevent horizontal scroll ── */
      * { max-width: 100%; }
      input, select, textarea { max-width: 100%; }

      /* ── Template grid on mobile ── */
      @media (max-width: 400px) {
        .template-grid { grid-template-columns: 1fr 1fr !important; }
      }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(24px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50%       { transform: translateY(-12px); }
      }
      @keyframes pulse-ring {
        0%   { transform: scale(0.8); opacity: 0.8; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      .fade-up  { animation: fadeUp 0.6s ease both; }
      .float    { animation: float 4s ease-in-out infinite; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
